name: Deploy

# Образ веба собирается в GitHub Actions и публикуется в GHCR при каждом пуше в main.
# Сервер раз в 30 секунд проверяет новый образ (deploy/tugen-update.timer) и перезапускает сайт сам.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имя образа в GHCR — только строчными; метка source привязывает пакет к репозиторию
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/epic-group12345/tugen.webservices
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
