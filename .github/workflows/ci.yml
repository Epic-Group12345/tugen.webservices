name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      # Сборка первой: плагин Uniwind пишет uniwind-types.d.ts, без которого не сойдутся типы тем
      - run: yarn build
      - run: yarn typecheck
      - run: npx prettier --check src vite.config.ts
