# Веб TUGEN на сервере: сайт с бэкендом и, если 80/443 свободны, Caddy перед ним.
# Лежит в /opt/tugen вместе с .env (ADMIN_TOKEN, SITE_ADDRESS, COMPOSE_PROFILES); ставит deploy/install.sh.
# Если на сервере уже есть nginx, Caddy не запускается, а nginx проксирует на 127.0.0.1:WEB_PORT (nginx-tugen.conf).
services:
  web:
    # Образ собирает GitHub Actions (.github/workflows/deploy.yml); новый подтягивает update.sh
    image: ghcr.io/epic-group12345/tugen.webservices:latest
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    # Только для локального прокси (nginx на этом же сервере); снаружи порт закрыт
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    volumes:
      - web-data:/data

  caddy:
    # Включается COMPOSE_PROFILES=caddy в .env: install.sh ставит его, только если порт 80 свободен
    profiles: [caddy]
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      # Домен — Caddy сам получит сертификат и включит HTTPS; без домена сайт работает по http на IP
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      SITE_TLS: ${SITE_TLS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты certbot для SITE_TLS; live/ — ссылки в archive/, поэтому монтируется весь каталог
      - ${LETSENCRYPT_DIR:-./letsencrypt}:/etc/letsencrypt:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  web-data:
  caddy-data:
  caddy-config:
