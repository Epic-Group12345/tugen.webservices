# Сайт TUGEN за nginx, который уже держит 80/443 на сервере (вместо Caddy).
# Положить в /etc/nginx/sites-available/tugen, включить ссылкой в sites-enabled, затем `nginx -t && systemctl reload nginx`.
# server_name — IP сервера или домен TUGEN; для HTTPS по домену: certbot --nginx -d <домен>.
server {
	listen 80;
	listen [::]:80;
	server_name 176.108.251.224;

	# Отчёт о сбое лаунчера с минидампом — до 4 МБ (src/tugen_web/crashes.nim)
	client_max_body_size 5m;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
